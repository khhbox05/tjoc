<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>學刊稿件管理系統</title>
<style>
  html,body{margin:0;height:100%;background:#f5f6f8}
  iframe{display:block;border:0;width:100%;height:100vh;height:100dvh}
  .box{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;
       font:15px/1.6 -apple-system,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;color:#1f2933}
  .card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:28px 32px;max-width:420px;text-align:center}
  .card h1{font-size:18px;margin:0 0 8px} .card p{margin:0;color:#6b7280}
  .alt{position:fixed;right:10px;bottom:8px;font:12px sans-serif;color:#9ca3af;text-decoration:none;background:rgba(255,255,255,.85);padding:2px 8px;border-radius:6px}
  .alt:hover{color:#2459a8}
</style>
</head>
<body>
<script>
  // ▼▼▼ 只要改這一行：把引號內換成系統網址（https://script.google.com/macros/s/.../exec）▼▼▼
  var SYSTEM_URL = "https://script.google.com/macros/s/AKfycbwbrwXptukYoDsODOEuSfaVVSxlaJv0Tkue7-U8xcy4T1ITq47gGjdvAKKRDyA_Wc1bSw/exec";
  // ▲▲▲ 其他地方都不用改 ▲▲▲

  if (/^https:\/\/script\.google\.com\//.test(SYSTEM_URL)) {
    // 系統嵌在這個頁面裡顯示，網址列只會看到 GitHub 的網址
    document.write('<iframe src="' + SYSTEM_URL + '" title="學刊稿件管理系統" allow="clipboard-write"></iframe>' +
      '<a class="alt" href="' + SYSTEM_URL + '" target="_top">畫面空白或無法登入？點這裡直接開啟</a>');
  } else {
    document.write('<div class="box"><div class="card"><h1>學刊稿件管理系統</h1><p>尚未設定系統網址，請管理者編輯 index.html。</p></div></div>');
  }
</script>
</body>
</html>
